@if (totalElements() > 0) {
  <div class="pagination-container">
    <div class="pagination-info">
      Affichage de <span class="highlight">{{ firstItemIndex() }}</span> à <span class="highlight">{{ lastItemIndex() }}</span> sur <span class="highlight">{{ totalElements() }}</span> éléments
    </div>

    <div class="pagination-controls">
      <div class="page-size-selector">
        <label for="pageSizeSelect">Par page :</label>
        <select id="pageSizeSelect" [value]="pageSize()" (change)="onSizeChange($event)">
          @for (opt of pageSizeOptions(); track opt) {
            <option [value]="opt">{{ opt }}</option>
          }
        </select>
      </div>

      <div class="pagination-nav">
        <button
          class="btn-nav"
          [disabled]="page() === 0"
          (click)="goToPage(page() - 1)"
          title="Page précédente"
          aria-label="Page précédente"
        >
          ‹
        </button>

        @for (p of pagesList(); track $index) {
          @if (p < 0) {
            <span class="pagination-ellipsis">…</span>
          } @else {
            <button
              class="btn-page"
              [class.active]="p === page()"
              (click)="goToPage(p)"
            >
              {{ p + 1 }}
            </button>
          }
        }

        <button
          class="btn-nav"
          [disabled]="page() >= totalPages() - 1"
          (click)="goToPage(page() + 1)"
          title="Page suivante"
          aria-label="Page suivante"
        >
          ›
        </button>
      </div>
    </div>
  </div>
}
